<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart Lab — OHLC Study Tool</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">CL</span>
    <div class="brand-text">
      <h1>Chart Lab</h1>
      <p>Candlestick study tool</p>
    </div>
  </div>

  <div class="file-controls">
    <label class="file-btn" for="csv-input">Load CSV</label>
    <input type="file" id="csv-input" accept=".csv" hidden>
    <span id="file-name" class="file-name">No file loaded</span>
  </div>
</header>

<main class="workspace">

  <section class="chart-column">
    <div class="pane-label">
      <span id="series-title">No data loaded</span>
      <span id="ohlc-readout" class="ohlc-readout"></span>
    </div>
    <div id="main-chart" class="chart-box"></div>

    <div class="pane-label pane-label-sub">
      <span>Oscillator pane</span>
      <span id="osc-readout" class="ohlc-readout"></span>
    </div>
    <div id="osc-chart" class="chart-box chart-box-sub"></div>
  </section>

  <aside class="sidebar">

    <div class="panel">
      <h2>Add indicator</h2>
      <form id="indicator-form">
        <label for="ind-type">Type</label>
        <select id="ind-type">
          <option value="sma">Simple Moving Average (SMA)</option>
          <option value="ema">Exponential Moving Average (EMA)</option>
          <option value="bbands">Bollinger Bands</option>
          <option value="rsi">RSI</option>
          <option value="macd">MACD</option>
        </select>

        <div id="param-fields"></div>

        <button type="submit" class="primary-btn">Add to chart</button>
      </form>
    </div>

    <div class="panel">
      <h2>Active indicators</h2>
      <ul id="indicator-list" class="indicator-list">
        <li class="empty-note">None added yet.</li>
      </ul>
    </div>

    <div class="panel">
      <h2>Data summary</h2>
      <table class="summary-table">
        <tbody>
          <tr><td>Rows</td><td id="stat-rows">—</td></tr>
          <tr><td>Range start</td><td id="stat-start">—</td></tr>
          <tr><td>Range end</td><td id="stat-end">—</td></tr>
          <tr><td>Last close</td><td id="stat-close">—</td></tr>
        </tbody>
      </table>
    </div>

  </aside>

</main>

<footer class="statusbar">
  <span>Chart Lab — local, browser-only. Nothing is uploaded anywhere.</span>
  <span id="status-msg"></span>
</footer>

<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="indicators.js"></script>
<script src="app.js"></script>
</body>
</html>
